[package]
name = "ani-gui"
version = "1.0.0"
edition = "2024"
description = "Native Linux desktop client for ani-cli"
license = "GPL-3.0-or-later"

[dependencies]
anyhow = "1.0.105"
gpui = "0.2.2"
nix = { version = "0.31.4", features = ["process", "signal", "term"] }
regex = "1.13.2"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = { version = "3.5.2", features = ["json"] }

[patch.crates-io]
xattr = { path = "vendor/xattr" }

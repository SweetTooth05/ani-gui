name: CI

on:
  push:
    branches: [main, master, native-gpui]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libxkbcommon-x11-dev libxkbcommon-dev libwayland-dev libvulkan-dev \
            libfontconfig-dev libfreetype-dev libxcb1-dev \
            libmpv-dev ffmpeg

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: rustfmt
        run: cargo fmt --check

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: test
        run: cargo test

  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck desktop-file-utils

      - name: shellcheck
        run: shellcheck install.sh

      - name: desktop-file-validate
        run: desktop-file-validate assets/ani-gui.desktop

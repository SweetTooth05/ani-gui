name: CI

on:
  push:
    branches: [main, master, native-gpui]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libxkbcommon-x11-dev libxkbcommon-dev libwayland-dev libvulkan-dev \
            libfontconfig-dev libfreetype-dev libxcb1-dev \
            libmpv-dev ffmpeg

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: rustfmt
        run: cargo fmt --check

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: test
        run: cargo test

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # libmpv for the playback tests (they skip without it); ffmpeg comes
      # with it and makes their test clip. `make app` bundles libmpv into the
      # .app with dylibbundler.
      - name: Install mpv
        run: brew install mpv dylibbundler

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: rustfmt
        run: cargo fmt --check

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: test
        run: cargo test

      - name: make app
        run: |
          make app
          plutil -lint target/release/ani-gui.app/Contents/Info.plist
          codesign --verify --deep --strict --verbose=2 target/release/ani-gui.app
          file target/release/ani-gui.app/Contents/MacOS/ani-gui
          test -x target/release/ani-gui.app/Contents/Resources/bin/ani-cli
          plutil -extract LSMinimumSystemVersion raw target/release/ani-gui.app/Contents/Info.plist
          ls target/release/ani-gui.app/Contents/Frameworks
          python3 -c 'import ctypes, sys; ctypes.CDLL(sys.argv[1])' \
            target/release/ani-gui.app/Contents/Frameworks/libmpv.2.dylib

      - name: make dmg
        run: |
          packaging/macos/build-dmg.sh target/release/ani-gui.app target/ani-gui.dmg
          ls -l target/ani-gui.dmg

  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck desktop-file-utils

      - name: shellcheck
        run: shellcheck install.sh packaging/*.sh packaging/*/*.sh

      - name: desktop-file-validate
        run: desktop-file-validate assets/ani-gui.desktop

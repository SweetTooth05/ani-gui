name: Bug report
description: Something isn't working
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Search for "..."
        2. Click ...
        3. ...
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Distro and desktop
      placeholder: Ubuntu 24.04, GNOME on Wayland / Arch, KDE on X11 / ...
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: The commit you built (`git rev-parse --short HEAD`) and `ani-cli -V`
      placeholder: 58ec764, ani-cli 4.14.1
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Settings → Diagnostics
      description: What the Diagnostics panel in Settings shows.
  - type: textarea
    id: logs
    attributes:
      label: Terminal output
      description: Run `ani-gui` from a terminal and paste its output around the error.
      render: shell
